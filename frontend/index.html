<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#f6f6f6" id="meta-theme-color" />
    <title>folio</title>
    <style>
      html {
        background: #f6f6f6;
      }
      html[data-theme="dark"] {
        background: #171717;
      }
    </style>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("folio:theme") || "light";
          document.documentElement.dataset.theme = t;
          var m = document.getElementById("meta-theme-color");
          if (m)
            m.setAttribute("content", t === "dark" ? "#171717" : "#f6f6f6");
          if (window.FolioSplash && window.FolioSplash.setTheme) {
            window.FolioSplash.setTheme(t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
