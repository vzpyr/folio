name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-15
            bundles: app,dmg
            rustup: aarch64-apple-darwin,x86_64-apple-darwin
            cargo: universal-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustup }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version 2.11.4

      - name: Build
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
          CARGO_TARGET: ${{ matrix.cargo }}
        run: |
          args=""
          if [ -n "$CARGO_TARGET" ]; then
            args="--target $CARGO_TARGET"
          fi
          cargo tauri build --bundles $BUNDLES $args

      - name: Rename
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd src-tauri/target
          while IFS= read -r f; do
            d="${f%/*}"
            case "$f" in
              *.deb) mv "$f" "$d/folio-${VERSION#v}-amd64.deb" ;;
              *.rpm) mv "$f" "$d/folio-${VERSION#v}-x86_64.rpm" ;;
              *.AppImage) mv "$f" "$d/folio-${VERSION#v}-x86_64.AppImage" ;;
              *setup.exe) mv "$f" "$d/folio-${VERSION#v}-x64-setup.exe" ;;
              *.dmg) mv "$f" "$d/folio-${VERSION#v}-universal.dmg" ;;
            esac
          done < <(find . -path '*/bundle/*/*' -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' \))

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/dmg/*.dmg
          draft: true
          generate_release_notes: true

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: android-actions/setup-android@v3

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version 2.11.4

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no keystore secrets — building unsigned"
            exit 0
          fi
          mkdir -p "$HOME/.android-keystores"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android-keystores/apps.jks"
          cat > "$HOME/.android-keystores/keystore.properties" <<EOF
          storeFile=$HOME/.android-keystores/apps.jks
          storePassword=$ANDROID_KEYSTORE_STORE_PASSWORD
          keyAlias=$ANDROID_KEYSTORE_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_KEY_PASSWORD
          EOF
          keytool -list -keystore "$HOME/.android-keystores/apps.jks" -storepass "$ANDROID_KEYSTORE_STORE_PASSWORD" -alias "$ANDROID_KEYSTORE_KEY_ALIAS" >/dev/null

      - name: Build
        run: cargo tauri android build --apk --ci

      - name: Rename
        env:
          VERSION: ${{ github.ref_name }}
        run: mv src-tauri/gen/android/app/build/outputs/apk/release/*.apk src-tauri/gen/android/app/build/outputs/apk/release/folio-${VERSION#v}-universal.apk

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/**/*.apk
          draft: true
          generate_release_notes: true

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version 2.11.4

      - name: Initialise iOS project
        run: cargo tauri ios init --ci

      - name: Apply app icons
        run: |
          for set in $(find src-tauri/gen/apple -type d -name AppIcon.appiconset); do
            cp -f src-tauri/icons/ios/*.png "$set"/
          done

      - name: Allow http sync
        run: |
          for plist in $(find src-tauri/gen/apple -name Info.plist); do
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist" 2>/dev/null || true
          done

      - name: Build
        run: cargo tauri ios build --no-sign --ci

      - name: Rename
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          f=$(find src-tauri/gen/apple/build -name '*.ipa' | head -1)
          mv "$f" "${f%/*}/folio-${VERSION#v}.ipa"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/apple/build/**/*.ipa
          draft: true
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/vzpyr/folio-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  checksums:
    runs-on: ubuntu-latest
    needs: [build, android, ios]
    steps:
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'folio-*'
          rm -f *SHA256SUMS
          sha256sum folio-* > "folio-${GITHUB_REF_NAME#v}-SHA256SUMS"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: assets/folio-*-SHA256SUMS
          draft: true
          generate_release_notes: true
