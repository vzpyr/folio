services:
  folio:
    image: ghcr.io/vzpyr/folio-server:latest
    container_name: folio
    env_file: .env
    ports:
      - "${FOLIO_HOST_PORT:-8080}:${FOLIO_PORT:-8080}"
    volumes:
      - folio_data:/data
    user: "1000:1000"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/${FOLIO_PORT:-8080}; printf "GET /api/health HTTP/1.0\r\n\r\n" >&3; grep -q " 200 " <&3',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  folio_data:
